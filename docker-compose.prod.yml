services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-beango}
      MARIADB_USER: ${DB_USERNAME:-beango}
      MARIADB_PASSWORD: ${DB_PASSWORD:-beango}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_NAMESPACE:-willian95}/beango-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    # Sin puertos publicados: solo se entra por el proxy (HTTPS).
    environment: &backend_environment
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:8081}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-beango}
      DB_USERNAME: ${DB_USERNAME:-beango}
      DB_PASSWORD: ${DB_PASSWORD:-beango}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    image: ${DOCKERHUB_NAMESPACE:-willian95}/beango-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    user: www-data
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment: *backend_environment
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: ${DOCKERHUB_NAMESPACE:-willian95}/beango-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    user: www-data
    command: php artisan schedule:work
    environment: *backend_environment
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  front:
    image: ${DOCKERHUB_NAMESPACE:-willian95}/beango-front:${FRONT_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  admin:
    image: ${DOCKERHUB_NAMESPACE:-willian95}/beango-admin:${ADMIN_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BEANGO_DOMAIN: ${BEANGO_DOMAIN:?Define BEANGO_DOMAIN en .env}
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados emitidos: si se pierden, Caddy los vuelve a pedir y se
      # puede chocar con los límites de Let's Encrypt.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - front
      - admin
      - backend

volumes:
  db_data:
  redis_data:
  backend_storage:
  caddy_data:
  caddy_config:
