services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-beango}
      MARIADB_USER: ${DB_USERNAME:-beango}
      MARIADB_PASSWORD: ${DB_PASSWORD:-beango}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./beango-backend
      dockerfile: ../infra/backend.Dockerfile
      additional_contexts:
        infra: ./infra
    restart: unless-stopped
    ports:
      - "8000:80"
    environment: &backend_environment
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:8081}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-beango}
      DB_USERNAME: ${DB_USERNAME:-beango}
      DB_PASSWORD: ${DB_PASSWORD:-beango}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: ./beango-backend
      dockerfile: ../infra/backend.Dockerfile
      additional_contexts:
        infra: ./infra
    restart: unless-stopped
    user: www-data
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    environment: *backend_environment
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./beango-backend
      dockerfile: ../infra/backend.Dockerfile
      additional_contexts:
        infra: ./infra
    restart: unless-stopped
    user: www-data
    command: php artisan schedule:work
    environment: *backend_environment
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  front:
    build:
      context: ./beango-front
      dockerfile: ../infra/front.Dockerfile
      additional_contexts:
        infra: ./infra
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  admin:
    build:
      context: ./beango-admin
      dockerfile: ../infra/admin.Dockerfile
      additional_contexts:
        infra: ./infra
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  backend_storage:
