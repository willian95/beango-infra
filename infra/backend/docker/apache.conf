<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Detrás del proxy (Caddy) la petición llega por HTTP. Con esto PHP ve
    # HTTPS=on y Laravel genera URLs https:// (paginación, url(), redirects)
    # en vez de http://, que el navegador bloquearía como contenido mixto.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
